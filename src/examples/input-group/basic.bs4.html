<div style="display:grid;gap:1rem;max-width:26rem">
  <div class="input-group">
    <div class="input-group-prepend"><span class="input-group-text">@</span></div>
    <input type="text" class="form-control" placeholder="Username" aria-label="Username">
  </div>
  <div class="input-group">
    <input type="text" class="form-control" placeholder="Search courses" aria-label="Search courses">
    <div class="input-group-append"><button type="button" class="btn btn-primary"><i data-pix="a/search"></i> Search</button></div>
  </div>
  <div class="input-group">
    <input type="number" class="form-control" value="20" aria-label="Amount">
    <div class="input-group-append"><span class="input-group-text">%</span></div>
  </div>
  <div class="input-group">
    <select class="custom-select" aria-label="Action"><option>Hide</option><option>Delete</option></select>
    <div class="input-group-append"><button type="button" class="btn btn-outline-secondary">Apply</button></div>
  </div>
</div>
