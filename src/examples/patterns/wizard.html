<div style="display:grid;grid-template-columns:minmax(9rem,11rem) minmax(0,1fr);gap:1rem;align-items:start">
  <ol class="dd-steps dd-steps-vertical" aria-label="Import a course">
    <li class="dd-step is-done"><span class="dd-step-label">Choose file</span><span class="dd-step-text">algebra-1.mbz · 38 MB</span></li>
    <li class="dd-step is-current" aria-current="step"><span class="dd-step-label">Select activities</span><span class="dd-step-text">What to bring.</span></li>
    <li class="dd-step"><span class="dd-step-label">Review</span></li>
    <li class="dd-step"><span class="dd-step-label">Import</span></li>
  </ol>
  <div class="card">
    <div class="card-body" style="display:grid;gap:1rem">
      <div><h3 class="h5 mb-1">Select activities</h3><p class="form-text mt-0 mb-0">12 activities in 3 units. Choose what to import.</p></div>
      <div class="dd-tags-demo" style="display:grid;gap:.5rem">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="wz-1" checked><label class="form-check-label" for="wz-1">Unit 1 · Numbers <span class="badge badge-soft rounded-pill text-bg-secondary">4 activities</span></label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="wz-2" checked><label class="form-check-label" for="wz-2">Unit 2 · Functions <span class="badge badge-soft rounded-pill text-bg-secondary">5 activities</span></label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="wz-3"><label class="form-check-label" for="wz-3">Unit 3 · Equations <span class="badge badge-soft rounded-pill text-bg-secondary">3 activities</span></label></div>
      </div>
      <div class="alert alert-info mb-0" role="note">Grades and user data are not imported. You can add them later.</div>
    </div>
    <div class="card-footer" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem">
      <button type="button" class="btn btn-link"><i data-pix="i/previous"></i> Back</button>
      <span style="display:flex;gap:.5rem"><button type="button" class="btn btn-outline-secondary">Cancel</button><button type="button" class="btn btn-primary">Next <i data-pix="i/next"></i></button></span>
    </div>
  </div>
</div>
