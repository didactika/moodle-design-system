name: CI

# Only on pull requests. A push to main is built, checked and published by the Pages workflow, which runs the same `npm run build`, so
# building it here too would run the same job twice for every merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job the ruleset of the repository requires. It builds the Moodle stylesheets and the site and checks the content, so a red
  # site never reaches main, which is what gets published.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
