<section style="display:grid;gap:1rem">
  <header class="dd-page-header">
    <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="#">Site</a></li><li class="breadcrumb-item active" aria-current="page">Courses</li></ol></nav>
    <div class="dd-page-header-row">
      <div class="dd-page-header-main"><div><h1 class="dd-page-title">Courses</h1><p class="dd-page-subtitle">48 courses in 6 categories</p></div></div>
      <div class="dd-page-actions"><button type="button" class="btn btn-primary"><i data-pix="t/add"></i> New course</button></div>
    </div>
  </header>
  <div class="dd-chips" role="group" aria-label="Filter courses">
    <button type="button" class="dd-chip" aria-pressed="true">All <span class="dd-chip-count">48</span></button>
    <button type="button" class="dd-chip" aria-pressed="false">In progress <span class="dd-chip-count">12</span></button>
    <button type="button" class="dd-chip" aria-pressed="false">Completed <span class="dd-chip-count">31</span></button>
    <button type="button" class="dd-chip" aria-pressed="false">Hidden <span class="dd-chip-count">5</span></button>
  </div>
  <div class="card">
    <div class="table-toolbar">
      <div class="table-toolbar-start"><div class="input-group"><span class="input-group-text"><i data-pix="a/search"></i></span><input class="form-control" type="search" placeholder="Search courses" aria-label="Search courses"></div></div>
      <div class="table-toolbar-end"><button type="button" class="btn btn-outline-secondary btn-sm"><i data-pix="t/download"></i> Export</button></div>
    </div>
    <div class="table-responsive" style="border:0;border-radius:0">
      <table class="table table-hover mb-0">
        <thead><tr>
          <th scope="col" class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select all"></div></th>
          <th scope="col" aria-sort="ascending"><button type="button" class="table-sort">Course</button></th>
          
          <th scope="col" class="text-end"><button type="button" class="table-sort">Students</button></th>
          <th scope="col">Status</th>
          <th scope="col" class="table-actions"><span class="visually-hidden">Actions</span></th>
        </tr></thead>
        <tbody>
          <tr><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select Algebra I"></div></td><th scope="row">Algebra I</th><td class="text-end">128</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">Open</span></td><td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit Algebra I"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide Algebra I"><i data-pix="t/hide"></i></button></td></tr>
          <tr><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select Physics II"></div></td><th scope="row">Physics II</th><td class="text-end">94</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-warning">Draft</span></td><td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit Physics II"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide Physics II"><i data-pix="t/hide"></i></button></td></tr>
          <tr><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select World history"></div></td><th scope="row">World history</th><td class="text-end">156</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-secondary">Closed</span></td><td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit World history"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide World history"><i data-pix="t/hide"></i></button></td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-foot">
      <div class="dd-pager"><div class="dd-pager-size"><label for="wl-size">Rows per page</label><select class="form-select form-select-sm" id="wl-size"><option>10</option><option selected>20</option><option>50</option></select></div><div class="dd-pager-end"><span class="dd-pager-range"><b>1–3</b> of 48</span><div class="btn-group" role="group" aria-label="Pages"><button type="button" class="btn btn-outline-secondary btn-sm btn-icon" disabled aria-label="Previous"><i data-pix="t/left"></i></button><button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Next"><i data-pix="t/right"></i></button></div></div></div>
    </div>
  </div>
</section>
