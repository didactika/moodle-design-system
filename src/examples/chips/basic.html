<div style="display:grid;gap:1.25rem">
  <div class="dd-chips" role="group" aria-label="Filter courses">
    <button type="button" class="dd-chip" aria-pressed="true">All <span class="dd-chip-count">48</span></button>
    <button type="button" class="dd-chip" aria-pressed="false">In progress <span class="dd-chip-count">12</span></button>
    <button type="button" class="dd-chip" aria-pressed="false">Completed <span class="dd-chip-count">31</span></button>
    <button type="button" class="dd-chip" aria-pressed="false">Hidden <span class="dd-chip-count">5</span></button>
    <button type="button" class="dd-chip" disabled>Archived</button>
  </div>
  <div class="dd-chips" aria-label="Applied filters">
    <span class="dd-chip dd-chip-applied">Mathematics <button type="button" class="dd-chip-remove" aria-label="Remove Mathematics"></button></span>
    <span class="dd-chip dd-chip-applied">2026 <button type="button" class="dd-chip-remove" aria-label="Remove 2026"></button></span>
    <button type="button" class="btn btn-link btn-sm">Clear all</button>
  </div>
  <div class="dd-chips" aria-label="States">
    <button type="button" class="dd-chip">Rest</button>
    <button type="button" class="dd-chip ds-is-hover">Hover</button>
    <button type="button" class="dd-chip ds-is-focus">Focus</button>
    <button type="button" class="dd-chip" aria-pressed="true">Selected</button>
  </div>
</div>
