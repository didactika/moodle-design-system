name: Pages

on:
  push:
    branches: [main]
  # Every day, so the collaborators of the footer follow the organisation without a push.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages is turned on once by an administrator, with GitHub Actions as its source (gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow):
      # the token of a workflow cannot create the site, so asking configure-pages to do it fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
