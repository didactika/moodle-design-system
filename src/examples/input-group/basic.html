<div style="display:grid;gap:1rem;max-width:26rem">
  <div class="input-group">
    <span class="input-group-text">@</span>
    <input type="text" class="form-control" placeholder="Username" aria-label="Username">
  </div>
  <div class="input-group">
    <input type="text" class="form-control" placeholder="Search courses" aria-label="Search courses">
    <button type="button" class="btn btn-primary"><i data-pix="a/search"></i> Search</button>
  </div>
  <div class="input-group">
    <input type="number" class="form-control" value="20" aria-label="Amount">

  <div class="input-group">
    <select class="form-select" aria-label="Action"><option>Hide</option><option>Delete</option></select>
    <button type="button" class="btn btn-outline-secondary">Apply</button>
  </div>
