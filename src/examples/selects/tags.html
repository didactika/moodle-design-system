<form style="display:grid;gap:1.25rem;max-width:30rem">
  <div>
    <label class="form-label" for="tg-sel">Subjects (a select with several values)</label>
    <select class="form-select" id="tg-sel" multiple data-placeholder="Choose subjects">
      <option selected>Mathematics</option>
      <option>Physics</option>
      <option selected>Chemistry</option>
      <option>Biology</option>
      <option>History</option>
      <option>Literature</option>
    </select>
  </div>
  <div>
    <label class="form-label" for="tg-free">Tags (free text)</label>
    <div data-region="tags" class="form-control d-flex flex-wrap align-items-center gap-1 h-auto">
      <span class="badge rounded-pill text-bg-primary d-inline-flex align-items-center gap-1">algebra<button type="button" class="btn btn-link btn-icon btn-sm p-0" aria-label="Remove algebra"></button></span>
      <span class="badge rounded-pill text-bg-primary d-inline-flex align-items-center gap-1">unit 3<button type="button" class="btn btn-link btn-icon btn-sm p-0" aria-label="Remove unit 3"></button></span>
      <input class="form-control border-0 p-1 flex-grow-1 shadow-none" style="width:6rem;min-width:4rem" id="tg-free" type="text" placeholder="Add a tag">
    </div>
    <div class="form-text">Press Enter to add a tag.</div>
  </div>
  <div>
    <label class="form-label" for="tg-empty">Nothing chosen yet</label>
    <select class="form-select" id="tg-empty" multiple data-placeholder="Choose roles">
      <option>Student</option>
      <option>Teacher</option>
      <option>Manager</option>
    </select>
  </div>
</form>
