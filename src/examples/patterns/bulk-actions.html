<div style="display:grid;gap:1.25rem">
  <div class="card">
    <div class="table-responsive" style="border:0;border-radius:0">
      <table class="table mb-0">
        <thead><tr>
          <th scope="col" class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select all on this page" checked></div></th>
          <th scope="col">Course</th><th scope="col" class="text-end">Students</th><th scope="col">Status</th>
        </tr></thead>
        <tbody>
          <tr class="table-active"><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select Algebra I" checked></div></td><th scope="row">Algebra I</th><td class="text-end">128</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">Open</span></td></tr>
          <tr class="table-active"><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select Physics II" checked></div></td><th scope="row">Physics II</th><td class="text-end">94</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-warning">Draft</span></td></tr>
          <tr class="table-active"><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select World history" checked></div></td><th scope="row">World history</th><td class="text-end">156</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-secondary">Closed</span></td></tr>
          <tr><td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" aria-label="Select Chemistry lab"></div></td><th scope="row">Chemistry lab</th><td class="text-end">71</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">Open</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="dd-floatbar dd-floatbar-static" role="region" aria-label="Actions for the selected courses">
    <span class="dd-floatbar-count" role="status">3 selected</span>
    <div class="dd-floatbar-actions">
      <button type="button" class="btn btn-secondary btn-tonal btn-sm"><i data-pix="t/hide"></i> Hide</button>
      <button type="button" class="btn btn-secondary btn-tonal btn-sm"><i data-pix="t/copy"></i> Duplicate</button>
      <button type="button" class="btn btn-danger btn-tonal btn-sm"><i data-pix="t/delete"></i> Delete</button>
    </div>
    <button type="button" class="dd-floatbar-clear" title="Clear selection" aria-label="Clear selection"></button>
  </div>
</div>
