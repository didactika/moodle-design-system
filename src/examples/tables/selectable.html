<div class="card mb-0">
  <div class="table-toolbar">
    <div class="table-toolbar-start">
      <div class="input-group input-group-sm"><span class="input-group-text"><i data-pix="a/search"></i></span><input type="search" class="form-control" placeholder="Search courses" aria-label="Search courses"></div>
      <select class="form-select form-select-sm" aria-label="Category"><option>All categories</option><option>Mathematics</option><option>Sciences</option></select>
    </div>
    <div class="table-toolbar-end">
      <button type="button" class="btn btn-outline-secondary btn-sm"><i data-pix="i/export"></i> Export</button>
      <button type="button" class="btn btn-primary btn-sm"><i data-pix="t/add"></i> New course</button>
    </div>
  </div>
  <div class="table-toolbar table-toolbar-selection">
    <span>2 selected</span>
    <div class="table-toolbar-end"><button type="button" class="btn btn-outline-primary btn-sm"><i data-pix="t/hide"></i> Hide</button><button type="button" class="btn btn-outline-danger btn-sm"><i data-pix="t/delete"></i> Delete</button></div>
  </div>
  <div class="table-responsive" style="border:0;border-radius:0">
    <table class="table table-hover mb-0">
      <thead><tr>
        <th scope="col" class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" id="tsel-all" aria-label="Select all"></div></th>
        <th scope="col" aria-sort="ascending"><button type="button" class="table-sort">Course <i data-pix="t/sort_asc"></i></button></th>
        <th scope="col">Category</th>
        <th scope="col" class="text-end"><button type="button" class="table-sort">Students <i data-pix="t/sort"></i></button></th>
        <th scope="col">Status</th>
        <th scope="col" class="table-actions"><span class="visually-hidden">Actions</span></th>
      </tr></thead>
      <tbody>
      <tr>
        <td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" id="tsel-0" aria-label="Select Algebra I"></div></td>
        <th scope="row">Algebra I</th><td>Mathematics</td><td class="text-end">128</td>
        <td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">Open</span></td>
        <td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit Algebra I"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide Algebra I"><i data-pix="t/hide"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Delete" aria-label="Delete Algebra I"><i data-pix="t/delete"></i></button></td>
      </tr>
      <tr class="table-active">
        <td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" id="tsel-1" aria-label="Select Physics II" checked></div></td>
        <th scope="row">Physics II</th><td>Sciences</td><td class="text-end">94</td>
        <td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">Open</span></td>
        <td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit Physics II"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide Physics II"><i data-pix="t/hide"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Delete" aria-label="Delete Physics II"><i data-pix="t/delete"></i></button></td>
      </tr>
      <tr class="table-active">
        <td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" id="tsel-2" aria-label="Select Chemistry lab" checked></div></td>
        <th scope="row">Chemistry lab</th><td>Sciences</td><td class="text-end">71</td>
        <td><span class="badge badge-soft badge-dot rounded-pill text-bg-warning">Draft</span></td>
        <td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit Chemistry lab"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide Chemistry lab"><i data-pix="t/hide"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Delete" aria-label="Delete Chemistry lab"><i data-pix="t/delete"></i></button></td>
      </tr>
      <tr>
        <td class="table-select"><div class="form-check"><input class="form-check-input" type="checkbox" id="tsel-3" aria-label="Select World history"></div></td>
        <th scope="row">World history</th><td>Humanities</td><td class="text-end">156</td>
        <td><span class="badge badge-soft badge-dot rounded-pill text-bg-secondary">Closed</span></td>
        <td class="table-actions"><button type="button" class="btn btn-link btn-icon btn-sm" title="Edit" aria-label="Edit World history"><i data-pix="t/edit"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Hide" aria-label="Hide World history"><i data-pix="t/hide"></i></button><button type="button" class="btn btn-link btn-icon btn-sm" title="Delete" aria-label="Delete World history"><i data-pix="t/delete"></i></button></td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="table-foot">
    <div class="dd-pager">
      <div class="dd-pager-size"><label class="mb-0" for="tsel-size">Rows per page</label><select class="form-select form-select-sm" id="tsel-size"><option>10</option><option selected>20</option><option>50</option></select></div>
      <div class="dd-pager-end"><span class="dd-pager-range"><b>1–4</b> of 4</span><div class="btn-group" role="group" aria-label="Pages"><button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Previous page" disabled><i data-pix="i/previous"></i></button><button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Next page" disabled><i data-pix="i/next"></i></button></div></div>
    </div>
  </div>
</div>
