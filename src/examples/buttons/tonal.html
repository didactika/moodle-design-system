<div style="display:grid;gap:1.25rem">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.75rem">
    <button type="button" class="btn btn-primary btn-tonal"><i data-pix="t/add"></i> New</button>
    <button type="button" class="btn btn-secondary btn-tonal"><i data-pix="i/import"></i> Import</button>
    <button type="button" class="btn btn-success btn-tonal"><i data-pix="i/checked"></i> Publish</button>
    <button type="button" class="btn btn-danger btn-tonal"><i data-pix="t/delete"></i> Delete</button>
    <button type="button" class="btn btn-warning btn-tonal"><i data-pix="i/warning"></i> Review</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1rem">
    <span style="display:inline-flex;align-items:center;gap:.5rem"><button type="button" class="btn btn-primary btn-icon" title="Filled" aria-label="Filled"><i data-pix="t/edit"></i></button><small>Filled</small></span>
    <span style="display:inline-flex;align-items:center;gap:.5rem"><button type="button" class="btn btn-primary btn-tonal btn-icon" title="Tonal" aria-label="Tonal"><i data-pix="t/edit"></i></button><small>Tonal</small></span>
    <span style="display:inline-flex;align-items:center;gap:.5rem"><button type="button" class="btn btn-outline-secondary btn-icon" title="Outline" aria-label="Outline"><i data-pix="t/edit"></i></button><small>Outline</small></span>
    <span style="display:inline-flex;align-items:center;gap:.5rem"><button type="button" class="btn btn-link btn-icon" title="Plain" aria-label="Plain"><i data-pix="t/edit"></i></button><small>Plain</small></span>
    <span style="display:inline-flex;align-items:center;gap:.5rem"><button type="button" class="btn btn-danger btn-tonal btn-icon" title="Tonal danger" aria-label="Tonal danger"><i data-pix="t/delete"></i></button><small>Tonal danger</small></span>
  </div>
</div>
