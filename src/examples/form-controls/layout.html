<form class="card" style="max-width:42rem" novalidate>
  <div class="card-body" style="display:grid;gap:1.25rem">
    <div>
      <h3 class="h5 mb-1">New course</h3>
      <p class="form-text mt-0 mb-0">Fields marked with * are required.</p>
    </div>
    <div>
      <label class="form-label" for="fl-name">Course name <span class="text-danger" aria-hidden="true">*</span></label>
      <input class="form-control" id="fl-name" type="text" placeholder="Algebra I" required>
      <div class="form-text">Shown in lists and in the breadcrumb.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem">
      <div>
        <label class="form-label" for="fl-cat">Category</label>
        <select class="form-select w-100" id="fl-cat"><option>Mathematics</option><option>Sciences</option><option>Humanities</option></select>
      </div>
      <div>
        <label class="form-label" for="fl-short">Short name <span class="text-danger" aria-hidden="true">*</span></label>
        <input class="form-control is-valid" id="fl-short" type="text" value="ALG1" required>
        <div class="valid-feedback">Available.</div>
      </div>
    </div>
    <div>
      <label class="form-label" for="fl-id">Course ID</label>
      <input class="form-control is-invalid" id="fl-id" type="text" value="ALG 1" aria-describedby="fl-id-help">
      <div class="invalid-feedback" id="fl-id-help">Use letters, numbers and dashes, without spaces.</div>
    </div>
    <div>
      <label class="form-label" for="fl-sum">Summary</label>
      <textarea class="form-control" id="fl-sum" rows="3" placeholder="What students will learn"></textarea>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="fl-visible" checked>
      <label class="form-check-label" for="fl-visible">Visible to students</label>
    </div>
  </div>
  <div class="card-footer" style="display:flex;justify-content:flex-end;gap:.5rem">
    <button type="button" class="btn btn-outline-secondary">Cancel</button>
    <button type="submit" class="btn btn-primary">Create course</button>
  </div>
</form>
