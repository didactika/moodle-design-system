<form style="display:grid;gap:1rem;max-width:26rem" novalidate>
  <div>
    <label class="form-label" for="vl1">Short name</label>
    <input type="text" class="form-control is-valid" id="vl1" value="MATH101">
    <div class="valid-feedback">Looks good.</div>
  </div>
  <div>
    <label class="form-label" for="vl2">Email</label>
    <input type="email" class="form-control is-invalid" id="vl2" value="ada@" aria-describedby="vl2f">
    <div class="invalid-feedback" id="vl2f">Enter a valid email address.</div>
  </div>
  <div>
    <label class="form-label" for="vl3">Category</label>
    <select class="form-select is-invalid" id="vl3" aria-describedby="vl3f"><option value="">Choose...</option><option>Maths</option></select>
    <div class="invalid-feedback" id="vl3f">Choose a category.</div>
  </div>
  <div class="form-check">
    <input class="form-check-input is-invalid" type="checkbox" id="vl4" aria-describedby="vl4f">
    <label class="form-check-label" for="vl4">I accept the conditions</label>
    <div class="invalid-feedback" id="vl4f">You must accept to continue.</div>
  </div>
</form>
