<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1rem">
  <div class="form-check"><input class="form-check-input" type="checkbox" id="cs1"><label class="form-check-label" for="cs1">Rest</label></div>
  <div class="form-check"><input class="form-check-input ds-is-hover" type="checkbox" id="cs2"><label class="form-check-label" for="cs2">Hover</label></div>
  <div class="form-check"><input class="form-check-input ds-is-focus" type="checkbox" id="cs3"><label class="form-check-label" for="cs3">Focus</label></div>
  <div class="form-check"><input class="form-check-input" type="checkbox" id="cs4" checked><label class="form-check-label" for="cs4">Checked</label></div>
  <div class="form-check"><input class="form-check-input ds-is-focus" type="checkbox" id="cs5" checked><label class="form-check-label" for="cs5">Checked, focus</label></div>
  <div class="form-check"><input class="form-check-input is-invalid" type="checkbox" id="cs6"><label class="form-check-label" for="cs6">Invalid</label></div>
