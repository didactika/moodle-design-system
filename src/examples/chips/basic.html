<div style="display:grid;gap:1.25rem">
  <div class="d-flex flex-wrap align-items-center gap-2" role="group" aria-label="Filter courses">
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill active" aria-pressed="true">All <span class="badge rounded-pill text-bg-light">48</span></button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" aria-pressed="false">In progress <span class="badge rounded-pill text-bg-secondary">12</span></button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" aria-pressed="false">Completed <span class="badge rounded-pill text-bg-secondary">31</span></button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" aria-pressed="false">Hidden <span class="badge rounded-pill text-bg-secondary">5</span></button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" disabled>Archived</button>
  </div>
  <div class="d-flex flex-wrap align-items-center gap-2" aria-label="Applied filters">
    <span class="badge rounded-pill text-bg-primary d-inline-flex align-items-center gap-1">Mathematics <button type="button" class="btn btn-link btn-icon btn-sm p-0" aria-label="Remove Mathematics"><i data-pix="e/cancel"></i></button></span>
    <span class="badge rounded-pill text-bg-primary d-inline-flex align-items-center gap-1">2026 <button type="button" class="btn btn-link btn-icon btn-sm p-0" aria-label="Remove 2026"><i data-pix="e/cancel"></i></button></span>
    <button type="button" class="btn btn-link btn-sm">Clear all</button>
  </div>
  <div class="d-flex flex-wrap align-items-center gap-2" aria-label="States">
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill">Rest</button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill ds-is-hover">Hover</button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill ds-is-focus">Focus</button>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill active" aria-pressed="true">Selected</button>
  </div>
</div>
