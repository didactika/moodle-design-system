<div style="display:grid;gap:1.5rem">
  <div style="display:grid;grid-template-columns:5.5rem 1fr;align-items:center;gap:.75rem 1rem">
    <small style="color:var(--dd-muted);font-weight:600">Plain</small>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem">
      <button type="button" class="btn btn-link btn-icon" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
      <button type="button" class="btn btn-link btn-icon" title="Messages" aria-label="Messages, 12 unread"><i data-pix="t/message"></i><span class="badge rounded-pill text-bg-primary badge-float">12</span></button>
      <button type="button" class="btn btn-link btn-icon" title="Calendar" aria-label="Calendar, 99 or more events"><i data-pix="i/calendar"></i><span class="badge rounded-pill text-bg-warning badge-float">99+</span></button>
      <button type="button" class="btn btn-link btn-icon" title="Updates" aria-label="There are updates"><i data-pix="i/reload"></i><span class="badge rounded-pill text-bg-success badge-float"></span></button>
    </div>
    <small style="color:var(--dd-muted);font-weight:600">Tonal</small>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem">
      <button type="button" class="btn btn-primary btn-tonal btn-icon" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
      <button type="button" class="btn btn-primary btn-tonal btn-icon" title="Messages" aria-label="Messages, 12 unread"><i data-pix="t/message"></i><span class="badge rounded-pill text-bg-primary badge-float">12</span></button>
      <button type="button" class="btn btn-secondary btn-tonal btn-icon" title="Calendar" aria-label="Calendar, 99 or more events"><i data-pix="i/calendar"></i><span class="badge rounded-pill text-bg-warning badge-float">99+</span></button>
      <button type="button" class="btn btn-secondary btn-tonal btn-icon" title="Updates" aria-label="There are updates"><i data-pix="i/reload"></i><span class="badge rounded-pill text-bg-success badge-float"></span></button>
    </div>
    <small style="color:var(--dd-muted);font-weight:600">Outline</small>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem">
      <button type="button" class="btn btn-outline-secondary btn-icon" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
      <button type="button" class="btn btn-outline-secondary btn-icon" title="Messages" aria-label="Messages, 12 unread"><i data-pix="t/message"></i><span class="badge rounded-pill text-bg-primary badge-float">12</span></button>
      <button type="button" class="btn btn-outline-secondary btn-icon" title="Calendar" aria-label="Calendar, 99 or more events"><i data-pix="i/calendar"></i><span class="badge rounded-pill text-bg-warning badge-float">99+</span></button>
      <button type="button" class="btn btn-outline-secondary btn-icon" title="Updates" aria-label="There are updates"><i data-pix="i/reload"></i><span class="badge rounded-pill text-bg-success badge-float"></span></button>
    </div>
    <small style="color:var(--dd-muted);font-weight:600">Filled</small>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem">
      <button type="button" class="btn btn-primary btn-icon" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
      <button type="button" class="btn btn-secondary btn-icon" title="Messages" aria-label="Messages, 12 unread"><i data-pix="t/message"></i><span class="badge rounded-pill text-bg-primary badge-float">12</span></button>
    </div>
    <small style="color:var(--dd-muted);font-weight:600">Sizes</small>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem">
      <button type="button" class="btn btn-outline-secondary btn-icon btn-sm" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
      <button type="button" class="btn btn-outline-secondary btn-icon" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
      <button type="button" class="btn btn-outline-secondary btn-icon btn-lg" title="Notifications" aria-label="Notifications, 3 unread"><i data-pix="i/notifications"></i><span class="badge rounded-pill text-bg-danger badge-float">3</span></button>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.75rem">
    <button type="button" class="btn btn-outline-secondary"><i data-pix="t/message"></i> Messages <span class="badge rounded-pill text-bg-primary">4</span></button>
    <button type="button" class="btn btn-primary"><i data-pix="i/calendar"></i> Events <span class="badge rounded-pill text-bg-light">2</span></button>
  </div>
</div>
