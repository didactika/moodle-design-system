<div class="card" style="--dd-table-h:20rem">
  <div class="table-toolbar">
    <div class="table-toolbar-start" style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem">
      <div class="dd-searchbox" role="search"><i data-pix="a/search"></i><input class="form-control" type="search" placeholder="Search" aria-label="Search students"></div>
      <span class="dd-select-filter">
        <button type="button" class="form-select dd-select dd-select-set border-primary" aria-haspopup="true" aria-expanded="false">Status: Pending</button>
        <button type="button" class="dd-select-clear" title="Clear: Status" aria-label="Clear: Status"><i data-pix="e/cancel"></i></button>
      </span>
      <span class="dd-select-filter">
        <select class="form-select dd-select" aria-label="Group">
          <option value="" hidden selected>All groups</option>
          <option value="1">Group A</option>
          <option value="2">Group B</option>
        </select>
      </span>
      <span class="dd-select-filter">
        <button type="button" class="form-select dd-select" aria-haspopup="true" aria-expanded="false">Grading date</button>
      </span>
    </div>
    <div class="table-toolbar-end">
      <button type="button" class="btn btn-link btn-icon" title="Clear every filter" aria-label="Clear every filter"><i data-pix="i/reload"></i></button>
    </div>
  </div>
  <div class="table-responsive" data-region="tablewrap" style="border:0;border-radius:0">
    <table class="table table-hover mb-0">
      <caption class="visually-hidden">Students</caption>
      <thead><tr><th scope="col">Name</th><th scope="col">Group</th><th scope="col">Status</th><th scope="col">Grading date</th></tr></thead>
      <tbody>
        <tr><th scope="row">Ana Lopez</th><td>Group A</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-info">Pending</span></td><td>15/11/26, 12:22</td></tr>
        <tr><th scope="row">Bruno Marti</th><td>Group B</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-info">Pending</span></td><td>15/11/26, 12:22</td></tr>
        <tr><th scope="row">Carla Nunez</th><td>Group A</td><td><span class="badge badge-soft badge-dot rounded-pill text-bg-info">Pending</span></td><td>16/11/26, 09:10</td></tr>
      </tbody>
    </table>
  </div>
  <div class="table-foot">
    <div class="dd-pager">
      <div class="dd-pager-size"><label class="mb-0" for="sf-size">Rows per page</label><select class="form-select form-select-sm dd-select" id="sf-size"><option value="0" selected>All</option></select></div>
      <div class="dd-pager-end">
        <span class="dd-pager-range" role="status">1–3 of 3</span>
        <div class="dd-pager-arrows" style="display:flex;gap:.25rem">
          <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Previous page" disabled><i data-pix="i/previous"></i></button>
          <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Next page" disabled><i data-pix="i/next"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
