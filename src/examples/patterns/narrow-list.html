<div style="max-width:360px;--dd-table-h:18rem">
  <div class="dd-chips" role="group" aria-label="Filter by status" style="flex-wrap:nowrap;overflow-x:auto">
    <button type="button" class="dd-chip" aria-pressed="true" style="flex:none">All <span class="dd-chip-count">5</span></button>
    <button type="button" class="dd-chip" aria-pressed="false" style="flex:none">On <span class="dd-chip-count">3</span></button>
    <button type="button" class="dd-chip" aria-pressed="false" style="flex:none">Off <span class="dd-chip-count">2</span></button>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="table-responsive" data-region="tablewrap" style="border:0;border-radius:0">
      <table class="table mb-0">
        <caption class="visually-hidden">Activity types</caption>
        <thead><tr><th scope="col">Name</th><th scope="col">Status</th><th scope="col" class="text-end">Autograder</th></tr></thead>
        <tbody>
          <tr><th scope="row">Assignment<br><span class="small text-muted">Reads the hand-ins of students</span></th><td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">On</span></td><td class="text-end"><div class="form-check form-switch d-inline-block mb-0"><input class="form-check-input" type="checkbox" role="switch" checked aria-label="Assignment"></div></td></tr>
          <tr><th scope="row">Forum<br><span class="small text-muted">Reads the posts of students</span></th><td><span class="badge badge-soft badge-dot rounded-pill text-bg-success">On</span></td><td class="text-end"><div class="form-check form-switch d-inline-block mb-0"><input class="form-check-input" type="checkbox" role="switch" checked aria-label="Forum"></div></td></tr>
          <tr><th scope="row">Workshop<br><span class="small text-muted">Follows the completion of the activity</span></th><td><span class="badge badge-soft badge-dot rounded-pill text-bg-secondary">Off</span></td><td class="text-end"><div class="form-check form-switch d-inline-block mb-0"><input class="form-check-input" type="checkbox" role="switch" aria-label="Workshop"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
