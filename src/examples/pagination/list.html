<div style="display:grid;gap:1.75rem">
  <div class="dd-pager">
    <div class="dd-pager-size">
      <label class="mb-0" for="pg-size">Rows per page</label>
      <select class="form-select form-select-sm" id="pg-size"><option>10</option><option selected>20</option><option>50</option></select>
    </div>
    <div class="dd-pager-end">
      <span class="dd-pager-range"><b>21–40</b> of 312</span>
      <div class="btn-group" role="group" aria-label="Pages">
        <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="First page" title="First page"><i data-pix="t/angles-left"></i></button>
        <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Previous page" title="Previous page"><i data-pix="i/previous"></i></button>
        <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Next page" title="Next page"><i data-pix="i/next"></i></button>
        <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Last page" title="Last page"><i data-pix="t/angles-right"></i></button>
      </div>
    </div>
  </div>
  <div class="dd-pager" style="justify-content:flex-end">
    <div class="dd-pager-end">
      <span class="dd-pager-range"><b>1–20</b> of 312</span>
      <div class="btn-group" role="group" aria-label="Pages">
        <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Previous page" disabled><i data-pix="i/previous"></i></button>
        <button type="button" class="btn btn-outline-secondary btn-sm btn-icon" aria-label="Next page"><i data-pix="i/next"></i></button>
      </div>
    </div>
  </div>
  <div class="dd-pager">
    <span class="dd-pager-range">Page <b>3</b> of 16</span>
    <div class="dd-pager-end">
      <button type="button" class="btn btn-link btn-sm"><i data-pix="i/previous"></i> Previous</button>
      <button type="button" class="btn btn-primary btn-sm">Next <i data-pix="i/next"></i></button>
    </div>
  </div>
</div>
