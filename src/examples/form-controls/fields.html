<form style="max-width:26rem">
  <div class="mb-3">
    <label class="form-label" for="ex-name">Full name</label>
    <input type="text" class="form-control" id="ex-name" value="Ada Lovelace">
    <div class="form-text">As it appears on the certificate.</div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="ex-mail">Email</label>
    <input type="email" class="form-control" id="ex-mail" placeholder="name@example.org">
  </div>
  <div class="mb-3">
    <label class="form-label" for="ex-about">About</label>
    <textarea class="form-control" id="ex-about" rows="3">Mathematician and writer.</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label" for="ex-ro">Read only</label>
    <input type="text" class="form-control" id="ex-ro" value="ID 4821" readonly>
  </div>
  <div class="mb-0">
    <label class="form-label" for="ex-file">File</label>
    <input type="file" class="form-control" id="ex-file">
  </div>
</form>
