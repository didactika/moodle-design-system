<div style="display:grid;gap:.875rem;max-width:26rem">
  <div class="toast toast-solid toast-success show" role="status" aria-atomic="true"><div class="toast-body" style="display:flex;align-items:center;gap:.75rem"><i data-pix="i/checkedcircle"></i><span class="me-auto">Course published</span><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button></div></div>
  <div class="toast toast-solid toast-danger show" role="alert" aria-atomic="true"><div class="toast-body" style="display:flex;align-items:center;gap:.75rem"><i data-pix="i/risk_xss"></i><span class="me-auto">Upload failed</span><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button></div></div>
  <div class="toast toast-info show" role="status" aria-atomic="true">
    <div class="toast-body" style="display:flex;align-items:center;gap:.875rem"><span class="dd-tile dd-tile-round"><i data-pix="i/info"></i></span><div class="me-auto"><strong>Closing in a few seconds</strong><div class="small text-muted">A bar shows the time left.</div></div></div>
    <div class="progress"><div class="progress-bar" style="width:62%"></div></div>
  </div>
</div>
